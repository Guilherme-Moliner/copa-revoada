name: Publicar site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install openpyxl pillow 'opencv-python-headless<5'
      - name: Gerar index.html a partir da planilha
        # Se a variável PLANILHA_URL existir no repositório, o build usa a
        # planilha do Google Sheets. Sem ela, usa o .xlsx versionado.
        # Settings > Secrets and variables > Actions > Variables > New variable
        env:
          PLANILHA_URL: ${{ vars.PLANILHA_URL }}
          LANCES_URL: ${{ vars.LANCES_URL }}
        run: python3 scripts/build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
        id: deploy

